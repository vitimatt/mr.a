<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <title>Image</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      background: #fff;
      color: #000;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Helvetica;
      font-size: 16px;
      font-style: normal;
      font-weight: 400;
      line-height: 45px; /* 225% */
      letter-spacing: 1px;
      opacity: 0;
    }

    body.ready {
      opacity: 1;
      transition: opacity 0.7s ease;
    }

    .stage {
      position: relative;
      max-width: 85%;
      perspective: 900px;
      display: grid;
      place-items: center;
      opacity: 1;
      transition: opacity 0.7s ease;
    }

    .stage.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: calc((100dvh - 100%) / 2);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .caption sup {
      font-size: 0.65em;
      line-height: 0;
      vertical-align: super;
    }

    .rsvp {
      font: inherit;
      letter-spacing: inherit;
      color: inherit;
      line-height: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
    }

    .form-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: #fff;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .form-layer.is-in {
      opacity: 1;
    }

    .form-layer[hidden] {
      display: none;
    }

    .rsvp-form {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: max-content;
      max-width: calc(100% - 32px);
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      line-height: 1.2;
    }

    .form-mark {
      margin: 0 0 52px;
    }

    .form-mark sup {
      font-size: 0.65em;
      line-height: 0;
      vertical-align: super;
    }

    .rsvp-form input {
      width: 12em;
      max-width: 100%;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      letter-spacing: inherit;
      color: inherit;
      line-height: 1.2;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      margin: 0 0 14px;
      outline: none;
      touch-action: manipulation;
    }

    @media (pointer: coarse), (max-width: 800px) {
      .rsvp-form {
        left: 24px;
        right: 24px;
        width: auto;
        max-width: none;
      }

      .rsvp-form input {
        width: 100%;
      }

      .rsvp-form button {
        align-self: flex-start;
        text-align: left;
      }
    }

    .rsvp-form input::placeholder {
      color: #000;
      opacity: 1;
    }

    .rsvp-form button,
    .form-status {
      font: inherit;
      letter-spacing: inherit;
      color: inherit;
      line-height: 1.2;
      background: none;
      border: 0;
      padding: 0;
      margin: 38px 0 0;
      cursor: pointer;
    }

    .form-status {
      margin-top: 16px;
      cursor: default;
    }

    .form-status:empty {
      display: none;
    }

    img {
      max-width: 100%;
      max-height: 75dvh;
      width: auto;
      height: auto;
      display: block;
      transform-style: preserve-3d;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.08));
    }

    body.mobile img {
      cursor: pointer;
      touch-action: manipulation;
    }

    .empty {
      margin: 0;
      padding: 24px;
      text-align: center;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #111;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img id="photo" alt="" hidden>
    <p class="empty" id="empty">Add <code>images/image.jpg</code></p>
    <div class="caption" id="caption" hidden><span>made by mr.a<sup>®</sup></span><button type="button" class="rsvp" id="rsvp">RSVP</button></div>
  </div>
  <div class="form-layer" id="form-layer" hidden>
    <form class="rsvp-form" id="rsvp-form">
      <p class="form-mark">made by mr.a<sup>®</sup></p>
      <input type="text" name="name" placeholder="Name*" aria-label="Name" autocomplete="given-name" required>
      <input type="text" name="surname" placeholder="Surname*" aria-label="Surname" autocomplete="family-name" required>
      <input type="email" name="email" placeholder="Email*" aria-label="Email" autocomplete="email" required>
      <input type="text" name="instagram" placeholder="Instagram" aria-label="Instagram" autocomplete="username">
      <button type="submit">Submit</button>
      <p class="form-status" id="form-status"></p>
    </form>
  </div>
  <script>
    const img = document.getElementById("photo");
    const empty = document.getElementById("empty");
    const stage = document.querySelector(".stage");
    const caption = document.getElementById("caption");
    const rsvp = document.getElementById("rsvp");
    const formLayer = document.getElementById("form-layer");
    const rsvpForm = document.getElementById("rsvp-form");
    const formStatus = document.getElementById("form-status");
    const SUPABASE_URL = "https://dzhilxtzefnoxjtarmzy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2jYCwrMuznGZqYlfat6JwQ_378lev-4";
    const mobile = window.matchMedia("(pointer: coarse)").matches;
    const phone = window.matchMedia("(pointer: coarse), (max-width: 800px)").matches;

    const MAX = 16;
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let gyroOn = false;
    let baseBeta = null;
    let baseGamma = null;
    let shownSrc = "";

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function tick() {
      currentX += (targetX - currentX) * 0.12;
      currentY += (targetY - currentY) * 0.12;
      img.style.transform =
        "rotateX(" + currentX.toFixed(2) + "deg) rotateY(" + currentY.toFixed(2) + "deg)";
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function onMouse(event) {
      const nx = (event.clientX / window.innerWidth) * 2 - 1;
      const ny = (event.clientY / window.innerHeight) * 2 - 1;
      targetY = nx * MAX;
      targetX = -ny * MAX;
    }

    function resetTilt() {
      targetX = 0;
      targetY = 0;
    }

    function onOrientation(event) {
      if (event.beta == null || event.gamma == null) return;
      if (baseBeta == null) {
        baseBeta = event.beta;
        baseGamma = event.gamma;
      }
      const tiltY = clamp(event.gamma - baseGamma, -28, 28);
      const tiltX = clamp(event.beta - baseBeta, -28, 28);
      targetY = (tiltY / 28) * MAX * 3;
      targetX = (-tiltX / 28) * MAX * 3;
    }

    async function enableGyro() {
      if (gyroOn) return;
      try {
        const Orientation = window.DeviceOrientationEvent;
        if (Orientation && typeof Orientation.requestPermission === "function") {
          const state = await Orientation.requestPermission();
          if (state !== "granted") return;
        }
        baseBeta = null;
        baseGamma = null;
        window.addEventListener("deviceorientation", onOrientation);
        gyroOn = true;
      } catch (error) {}
    }

    if (mobile) {
      document.body.classList.add("mobile");
      img.addEventListener("click", enableGyro);
    } else {
      window.addEventListener("mousemove", onMouse);
      document.addEventListener("mouseleave", resetTilt);
    }

    const STATIC_IMAGES = [
      "/images/image.jpg",
      "/images/image.jpeg",
      "/images/image.webp",
      "/images/image.gif",
    ];

    function reveal() {
      if (document.body.classList.contains("ready")) return;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => document.body.classList.add("ready"));
      });
    }

    function showImage(src, cacheBust) {
      const next = cacheBust ? src + "?t=" + Date.now() : src;
      const preload = new Image();
      preload.onload = () => {
        img.src = preload.src;
        shownSrc = src;
        img.hidden = false;
        empty.hidden = true;
        caption.hidden = false;
        reveal();
      };
      preload.src = next;
    }

    function showEmpty() {
      img.hidden = true;
      img.removeAttribute("src");
      shownSrc = "";
      empty.hidden = false;
      caption.hidden = true;
      reveal();
    }

    function probe(src) {
      return new Promise((resolve) => {
        const test = new Image();
        test.onload = () => resolve(true);
        test.onerror = () => resolve(false);
        test.src = src;
      });
    }

    async function loadStaticImage() {
      for (const src of STATIC_IMAGES) {
        if (await probe(src)) {
          showImage(src, false);
          return true;
        }
      }
      return false;
    }

    async function loadImage() {
      try {
        const response = await fetch("/api/image", { cache: "no-store" });
        const type = response.headers.get("content-type") || "";
        if (response.ok && type.includes("json")) {
          const data = await response.json();
          if (!data.src) {
            showEmpty();
            return;
          }
          showImage(data.src, true);
          return;
        }
      } catch (error) {
        // Static hosts have no image API.
      }

      if (!(await loadStaticImage())) showEmpty();
    }

    const FADE_MS = 700;
    let transitioning = false;

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function nextFrame() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });
    }

    function alignForm() {
      if (phone) {
        rsvpForm.style.left = "";
        rsvpForm.style.width = "";
        rsvpForm.style.maxWidth = "";
        return;
      }
      const left = Math.max(0, stage.getBoundingClientRect().left);
      rsvpForm.style.left = left + "px";
      rsvpForm.style.width = "";
      rsvpForm.style.maxWidth = Math.max(120, window.innerWidth - left - 16) + "px";
    }

    function resetViewport() {
      window.scrollTo(0, 0);
    }

    rsvpForm.addEventListener("focusin", resetViewport);
    rsvpForm.addEventListener("focusout", () => {
      resetViewport();
      setTimeout(resetViewport, 80);
    });

    window.addEventListener("resize", alignForm);

    async function openForm() {
      if (transitioning || !formLayer.hidden) return;
      transitioning = true;
      formStatus.textContent = "";
      alignForm();
      stage.classList.add("fade-out");
      await wait(FADE_MS);
      formLayer.hidden = false;
      await nextFrame();
      formLayer.classList.add("is-in");
      await wait(FADE_MS);
      transitioning = false;
    }

    async function returnHome() {
      if (transitioning || formLayer.hidden) return;
      transitioning = true;
      formLayer.classList.remove("is-in");
      await wait(FADE_MS);
      formLayer.hidden = true;
      rsvpForm.reset();
      formStatus.textContent = "";
      const submit = rsvpForm.querySelector("button");
      submit.disabled = false;
      stage.classList.remove("fade-out");
      await wait(FADE_MS);
      transitioning = false;
    }

    rsvp.addEventListener("click", openForm);

    const instagramInput = rsvpForm.querySelector('[name="instagram"]');

    function instagramHandle(value) {
      return String(value || "").trim().replace(/^@+/, "").replace(/\s+/g, "");
    }

    function withAt(value) {
      const handle = instagramHandle(value);
      return handle ? "@" + handle : "@";
    }

    instagramInput.addEventListener("focus", () => {
      if (!instagramInput.value) instagramInput.value = "@";
      const end = instagramInput.value.length;
      requestAnimationFrame(() => instagramInput.setSelectionRange(end, end));
    });

    instagramInput.addEventListener("blur", () => {
      if (!instagramHandle(instagramInput.value)) instagramInput.value = "";
    });

    instagramInput.addEventListener("keydown", (event) => {
      const start = instagramInput.selectionStart || 0;
      const end = instagramInput.selectionEnd || 0;
      const atPrefix = start <= 1 && end <= 1;
      if (atPrefix && (event.key === "Backspace" || event.key === "Delete" || event.key === "ArrowLeft")) {
        event.preventDefault();
      }
    });

    instagramInput.addEventListener("input", () => {
      const start = instagramInput.selectionStart || 0;
      const next = withAt(instagramInput.value);
      if (instagramInput.value === next) return;
      const shift = next.length - instagramInput.value.length;
      instagramInput.value = next;
      const pos = Math.max(1, start + shift);
      instagramInput.setSelectionRange(pos, pos);
    });

    rsvpForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = rsvpForm.querySelector("button");
      const data = new FormData(rsvpForm);
      if (!SUPABASE_URL || !SUPABASE_KEY) {
        formStatus.textContent = "Add the Supabase URL and key to connect this form.";
        return;
      }
      submit.disabled = true;
      formStatus.textContent = "";
      try {
        const response = await fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rsvps", {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            Prefer: "return=minimal",
          },
          body: JSON.stringify({
            email: String(data.get("email") || "").trim(),
            name: String(data.get("name") || "").trim(),
            surname: String(data.get("surname") || "").trim(),
            instagram: instagramHandle(data.get("instagram")) ? withAt(data.get("instagram")) : "",
          }),
        });
        if (!response.ok) throw new Error("request failed");
        await returnHome();
      } catch (error) {
        formStatus.textContent = "Could not send. Try again.";
        submit.disabled = false;
      }
    });

    loadImage();
    setInterval(loadImage, 1500);
  </script>
</body>
</html>
